<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MINT Leads Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --ring: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.04);
    --s1: #2a78d6;          /* Facebook ads (categorical slot 1) */
    --s2: #eb6834;          /* Other sources (categorical slot 2) */
    --good: #0ca30c;
    --good-text: #006300;
    --warn: #fab219;
    --crit: #d03b3b;
    --navy: #0D1B3E;
    --mint: #3DBFA0;
    --mint-d: #2ea88c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink2: #c3c2b7;
      --grid: #2c2c2a;
      --axis: #383835;
      --ring: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.06);
      --s1: #3987e5;
      --s2: #d95926;
      --good-text: #0ca30c;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  /* login / setup */
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 28px; }
  .login-card h1 { font-size: 20px; margin-bottom: 6px; }
  .login-card p { color: var(--ink2); margin-bottom: 18px; }
  .login-card label { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 6px; }

  /* header */
  .top { background: var(--navy); color: #fff; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-weight: 700; letter-spacing: 0.06em; }
  .brand b { color: var(--mint); }
  .brand span { font-weight: 500; opacity: 0.7; margin-left: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-size: 12px; }
  .top-r { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .top-r .stamp { opacity: 0.65; }
  .top .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,0.35); }
  .top .btn:hover { background: rgba(255,255,255,0.1); }

  main { max-width: 1120px; margin: 0 auto; padding: 24px 20px 80px; }
  section { margin-bottom: 32px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); margin-bottom: 12px; }
  h2 small { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 8px; }

  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 18px 20px; }
  .grid { display: grid; gap: 12px; }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 860px) { .g4 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: 1fr; } }
  @media (max-width: 480px) { .g4 { grid-template-columns: 1fr; } }

  .label { font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
  .value { font-size: 28px; font-weight: 600; line-height: 1.15; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hero { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .hero .value { font-size: 56px; font-weight: 600; line-height: 1.05; }
  .top-row { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; margin-bottom: 12px; }
  .top-row .hero { margin-bottom: 0; }
  @media (max-width: 860px) { .top-row { grid-template-columns: 1fr; } }
  .quota { display: flex; align-items: center; gap: 18px; }
  .quota .info { min-width: 0; }
  svg text.ring-text { fill: var(--ink); font-weight: 600; }
  .delta { font-size: 12px; font-weight: 600; }
  .delta.up { color: var(--good-text); }
  .delta.down { color: var(--crit); }
  .delta.flat { color: var(--muted); }

  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--ring); background: var(--wash); white-space: nowrap; }
  .chip i { font-style: normal; }
  .chip.good i { color: var(--good-text); }
  .chip.warn i { color: #b57f00; }
  .chip.crit i { color: var(--crit); }
  .chip.mint i { color: var(--mint-d); }
  .chip.mute { color: var(--muted); font-weight: 500; }

  .btn { border: 1px solid var(--ring); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
  .btn:hover { background: var(--wash); }
  .btn.primary { background: var(--mint); border-color: var(--mint); color: #062a22; font-weight: 600; }
  .btn.primary:hover { background: var(--mint-d); }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .btn.danger { color: var(--crit); }
  .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--mint); outline-offset: 1px; }

  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=number], select, textarea {
    background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 7px 10px; width: 100%;
  }
  textarea { min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  dialog textarea { min-height: 70px; font-family: inherit; font-size: 14px; }
  dialog .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* filter row */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--ring); }
  .seg button[aria-pressed=true] { font-weight: 700; background: var(--wash); }
  .seg button[aria-pressed=true]::before { content: "\2713\00a0"; }
  .field-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); }
  .field-inline input { width: 84px; }

  /* chart */
  .chart-wrap { position: relative; }
  .chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink2); align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 150px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); z-index: 5; }
  .tip .d { color: var(--ink2); margin-bottom: 4px; }
  .tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .tip .r b { font-size: 13px; }
  .tip .k { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: middle; }
  svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .col-hit:hover ~ .x, .col:hover { opacity: 0.85; }
  .loading { opacity: 0.6; transition: opacity 0.15s; }

  /* tables */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.detail td { background: var(--wash); font-size: 12px; color: var(--ink2); }
  .nm { font-weight: 600; }
  .muted { color: var(--muted); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .tabs input[type=text] { max-width: 240px; margin-left: auto; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }

  .notice { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--ring); background: var(--wash); margin-bottom: 16px; font-size: 13px; }
  .notice.err { border-color: var(--crit); }
  details { margin-top: 14px; }
  summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; align-items: end; }
  .form-row label { font-size: 12px; font-weight: 600; color: var(--ink2); display: block; margin-bottom: 4px; }
  dialog { border: 1px solid var(--ring); border-radius: 10px; padding: 22px; background: var(--surface); color: var(--ink); max-width: 420px; width: calc(100% - 32px); margin: auto; }
  dialog::backdrop { background: rgba(0,0,0,0.4); }
  dialog h3 { font-size: 16px; margin-bottom: 4px; }
  dialog .row { margin-top: 12px; }
  dialog label { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 4px; }
  dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .fine { font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>

<div id="setup" class="center" hidden>
  <div class="login-card">
    <h1>One setup step left</h1>
    <p>Open <b>mint-leads.html</b> in a text editor and paste your Supabase Project URL and publishable key at the top of the script (the two lines marked PASTE).</p>
  </div>
</div>

<div id="login" class="center" hidden>
  <form class="login-card" id="login-form">
    <h1>MINT Leads</h1>
    <p>Enter your email and we'll send you a one-click login link.</p>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" required autocomplete="email">
    <button class="btn primary" style="width:100%;margin-top:14px;padding:10px" type="submit">Email me a login link</button>
    <div id="login-msg" class="fine" role="status"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><b>MINT</b><span>Leads</span></div>
    <div class="top-r">
      <span class="stamp" id="stamp"></span>
      <button class="btn sm primary" id="add-lead" type="button">+ Add lead</button>
      <button class="btn sm" id="refresh" type="button">Refresh</button>
      <button class="btn sm" id="signout" type="button">Sign out</button>
    </div>
  </header>

  <main id="main">
    <div id="notice"></div>

    <section id="sec-now"></section>

    <div class="filters" id="filters"></div>

    <section id="sec-leads"></section>
    <section id="sec-closing"></section>
    <section id="sec-list"></section>
    <section id="sec-clients"></section>
  </main>
</div>

<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
'use strict';

// ─────────────────────────────────────────────────────────────
// SETUP: paste your two Supabase values here (Project URL and publishable key).
// The publishable key is safe in a web page: your database rules only let YOU read leads.
// NEVER paste the secret key here.
// ─────────────────────────────────────────────────────────────
var SUPABASE_URL = 'https://auqgahjioeuzcmllywld.supabase.co';
var SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_EjyjPctzQ1O3OgT1rZL-Xw_Ly88pIGy';

var PACE_DEFAULT = 2;       // leads per day you consider "good"
var STALE_DAYS = 7;         // open leads older than this get a follow-up flag
var EARLY_N = 20;           // below this many leads, percentages are flagged "early"
var REFRESH_MS = 60000;

// ── tiny helpers ────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) appendKid(el, arguments[i]);
  return el;
}
function appendKid(el, kid) {
  if (kid === null || kid === undefined || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function (k) { appendKid(el, k); }); return; }
  el.appendChild(kid && kid.nodeType ? kid : document.createTextNode(String(kid)));
}
var SVGNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs) {
  var el = document.createElementNS(SVGNS, tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (attrs[k] === null || attrs[k] === undefined) return;
    if (k === 'text') el.textContent = attrs[k]; else el.setAttribute(k, attrs[k]);
  });
  for (var i = 2; i < arguments.length; i++) appendKid(el, arguments[i]);
  return el;
}
var usd0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
var usd2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
function money(n) { return n === null || n === undefined || isNaN(n) ? '—' : usd0.format(n); }
function money2(n) { return n === null || n === undefined || isNaN(n) ? '—' : usd2.format(n); }
function num(v) { var n = parseFloat(v); return isNaN(n) ? null : n; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function fmtShort(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
function fmtLong(d) { return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
function ageDays(iso) { return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

var FB_RE = /facebook|instagram|\bfb\b/i;
function isFb(src) { return FB_RE.test(src || ''); }
function monthlyFrom(freq, price) {
  if (price === null || price === undefined) return null;
  if (freq === 'weekly') return price * 52 / 12;
  if (freq === 'biweekly') return price * 26 / 12;
  if (freq === 'monthly') return price;
  return null;
}
var PLAN_LABEL = { weekly: 'Weekly', biweekly: 'Every 2 weeks', monthly: 'Monthly', deep: 'Deep clean', one_time: 'One-time' };
function planLabel(f) { return f ? (PLAN_LABEL[f] || f) : '—'; }

// What a lead is worth. Once a customer has picked a plan (or Jake recorded one), the value is exact.
// Until then, the calculator showed every plan, so the lead is a RANGE: low if they pick monthly,
// high if they pick weekly, and a "likely" figure weighted by the plans past customers have chosen.
var REC_PLANS = ['weekly', 'biweekly', 'monthly'];
function quoteOf(l, plan) { return num(l['quote_' + plan]); }
function hasQuotes(l) { return REC_PLANS.some(function (p) { return quoteOf(l, p) !== null; }); }
function planMix() {
  var counts = { weekly: 0, biweekly: 0, monthly: 0 }, total = 0;
  state.leads.forEach(function (l) {
    if ((l.status === 'approved' || l.status === 'booked') && counts[l.frequency] !== undefined) { counts[l.frequency]++; total++; }
  });
  if (total < 5) return { weekly: 0, biweekly: 1, monthly: 0, learned: false, total: total };   // too little history: assume every 2 weeks
  return { weekly: counts.weekly / total, biweekly: counts.biweekly / total, monthly: counts.monthly / total, learned: true, total: total };
}
function leadValue(l, mix) {
  var price = num(l.price);
  if (price !== null && l.frequency) {
    var m = monthlyFrom(l.frequency, price);
    return m !== null ? { kind: 'known', monthly: m } : { kind: 'known', oneTime: price };
  }
  if (num(l.est_monthly) !== null) return { kind: 'deal', monthly: num(l.est_monthly) };
  if (hasQuotes(l)) {
    var mo = REC_PLANS.map(function (p) { var q = quoteOf(l, p); return q === null ? null : monthlyFrom(p, q); }).filter(function (x) { return x !== null; });
    var likely = 0, w = 0;
    REC_PLANS.forEach(function (p) { var q = quoteOf(l, p); if (q !== null) { likely += mix[p] * monthlyFrom(p, q); w += mix[p]; } });
    return { kind: 'range', low: Math.min.apply(null, mo), high: Math.max.apply(null, mo), likely: w > 0 ? likely / w : Math.min.apply(null, mo) };
  }
  if (price !== null) return { kind: 'known', oneTime: price };
  return { kind: 'none' };
}

// ── state ───────────────────────────────────────────────────
var state = {
  leads: [], clients: [], clientsMissing: false,
  range: parseInt(store('mint_range'), 10) || 14,
  pace: num(store('mint_pace')) || PACE_DEFAULT,
  adSpend: num(store('mint_adspend')) || 0,
  quota: num(store('mint_quota')) || 3000, settingsOk: false,
  tab: 'open', search: '', expanded: {}, tableView: false,
  loadedAt: null, loading: false
};
var sb = null, started = false, timer = null;

// ── data ────────────────────────────────────────────────────
async function fetchAll(table) {
  var out = [], size = 1000;
  for (var from = 0; ; from += size) {
    var res = await sb.from(table).select('*').order('created_at', { ascending: false }).range(from, from + size - 1);
    if (res.error) throw res.error;
    out = out.concat(res.data);
    if (res.data.length < size) break;
  }
  return out;
}
async function loadSettings() {
  try {
    var r = await sb.from('settings').select('*');
    if (r.error) throw r.error;
    state.settingsOk = true;
    r.data.forEach(function (row) {
      var v = num(row.value);
      if (v === null) return;
      if (row.key === 'quota_mrr' && v > 0) state.quota = v;
      if (row.key === 'pace' && v >= 0) state.pace = v;
      if (row.key === 'ad_spend' && v >= 0) state.adSpend = v;
    });
  } catch (e) { state.settingsOk = false; }
}
// Settings live in the database (so every device agrees) and fall back to this browser if that is not set up.
function saveSetting(key, val) {
  var local = { quota_mrr: 'mint_quota', pace: 'mint_pace', ad_spend: 'mint_adspend' }[key];
  if (local) store(local, String(val));
  if (state.settingsOk) {
    sb.from('settings').upsert({ key: key, value: String(val), updated_at: new Date().toISOString() }, { onConflict: 'key' })
      .then(function (r) { if (r && r.error) notice('Could not save that setting: ' + r.error.message, true); });
  }
}
async function load() {
  if (state.loading) return;
  state.loading = true;
  $('main').classList.add('loading');
  try {
    state.leads = await fetchAll('leads');
    notice('');
  } catch (e) {
    notice('Could not load leads: ' + (e.message || e), true);
  }
  try {
    state.clients = await fetchAll('clients');
    state.clientsMissing = false;
  } catch (e) {
    state.clients = []; state.clientsMissing = true;
  }
  await loadSettings();
  state.loadedAt = new Date();
  state.loading = false;
  $('main').classList.remove('loading');
  renderAll();
}
function notice(msg, isErr) {
  var box = $('notice');
  box.replaceChildren();
  if (!msg) return;
  box.appendChild(h('div', { class: 'notice' + (isErr ? ' err' : ''), role: 'status', text: msg }));
}
async function act(fn, okMsg) {
  try { await fn(); if (okMsg) notice(okMsg); await load(); }
  catch (e) { notice('Something went wrong: ' + (e.message || e), true); }
}

// ── derived numbers ─────────────────────────────────────────
function isOpen(l) { return l.status === 'new' || l.status === 'approved'; }
function reachedApproval(l) { return !!l.approved_at || l.status === 'approved' || l.status === 'booked'; }
function groupStats(list) {
  var g = { leads: list.length, approved: 0, won: 0, lost: 0, open: 0 };
  list.forEach(function (l) {
    if (reachedApproval(l)) g.approved++;
    if (l.status === 'booked') g.won++;
    else if (l.status === 'lost') g.lost++;
    else g.open++;
  });
  return g;
}
function leadsBetween(from, to) {
  return state.leads.filter(function (l) { var t = new Date(l.created_at); return t >= from && t < to; });
}
function activeRecurring() {
  return state.clients.filter(function (c) { return c.status === 'active' && c.client_type === 'recurring'; });
}
function mrr() {
  return activeRecurring().reduce(function (a, c) { return a + (num(c.monthly_value) || 0); }, 0);
}

// ── render: right now ───────────────────────────────────────
function tile(label, value, sub, extra) {
  return h('div', { class: 'card' },
    h('div', { class: 'label', text: label }),
    h('div', { class: 'value', text: value }),
    sub ? h('div', { class: 'sub', text: sub }) : null, extra || null);
}
function quarterInfo() {

      var fresh = res.rows.filter(function (r) { return !have[r.name.trim().toLowerCase()]; });
      var dupes = res.rows.length - fresh.length;
      var msg = [];
      if (res.bad) msg.push(res.bad + ' line(s) skipped');
      if (dupes) msg.push(dupes + ' already in the list, skipped');
      impErr.textContent = msg.join('. ') + (msg.length ? '.' : '');
      if (!fresh.length) { impErr.textContent = 'Everyone in that list is already here. ' + impErr.textContent; return; }
      insertClientRows(fresh);
    } })), impErr));
}
// Reads one CSV line at a time, handling "quoted, fields" and "" inside quotes.
function csvFields(line) {
  var out = [], cur = '', q = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { out.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  out.push(cur.trim());
  return out;
}
// Accepts the MINT Tools export (Name, Type, Billing Type, Rate/Clean, Flat Rate, Cleans/Mo, Est MRR,
// Frequency, Start Date, Status, Notes) or the simple 4-column format. Returns ready-to-insert rows.
function parseClientCsv(text, existing) {
  var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
  var rows = [], bad = 0, today = dayKey(new Date());
  if (!lines.length) return { rows: rows, bad: 0 };
  var head = csvFields(lines[0]).map(function (x) { return x.toLowerCase(); });
  var tools = head.indexOf('est mrr') !== -1 && head.indexOf('name') !== -1;
  var col = function (name) { return head.indexOf(name); };
  lines.forEach(function (line, i) {
    if (i === 0 && (tools || /^name$/i.test(csvFields(line)[0]))) return;
    var p = csvFields(line);
    if (tools) {
      var get = function (name) { var k = col(name); return k === -1 ? '' : (p[k] || ''); };
      var name = get('name'), seg = get('type').toLowerCase();
      var rate = num(get('rate/clean')), flat = num(get('flat rate')), cleans = num(get('cleans/mo'));
      var mrrv = num(get('est mrr').replace(/[$,]/g, ''));
      if (mrrv === null) mrrv = flat > 0 ? flat : (rate && cleans ? Math.round(rate * cleans * 100) / 100 : null);
      if (!name || ['residential', 'commercial'].indexOf(seg) === -1 || mrrv === null) { bad++; return; }
      var freqRaw = get('frequency').toLowerCase().replace(/[\s-]/g, '');
      var freq = { weekly: 'weekly', biweekly: 'biweekly', monthly: 'monthly', '3x/week': '3x_week' }[freqRaw] || (freqRaw || 'monthly').replace(/[^a-z0-9]+/g, '_');
      var st = get('status').toLowerCase();
      var active = st === '' || st === 'active';
      var sd = get('start date'), notes = get('notes');
      if (st === 'on pause') notes = (notes ? notes + ' ' : '') + '(On pause when imported)';
      var row = { name: name, segment: seg, client_type: 'recurring', frequency: freq,
        per_visit_price: rate > 0 ? rate : null, monthly_value: mrrv, one_time_value: null,
        status: active ? 'active' : 'ended', ended_at: active ? null : new Date().toISOString(),
        start_date: /^\d{4}-\d{2}-\d{2}$/.test(sd) ? sd : today, source: 'import', is_existing: !!existing };
      if (notes) row.notes = notes;
      rows.push(row);
    } else {
      var seg2 = (p[1] || '').toLowerCase(), typ = (p[2] || '').toLowerCase().replace('-', '_').replace(' ', '_');
      var amt = num(p.slice(3).join('').replace(/[$,\s]/g, ''));
      if (!p[0] || ['residential', 'commercial'].indexOf(seg2) === -1 || ['recurring', 'one_time'].indexOf(typ) === -1 || amt === null) { bad++; return; }
      var rec = typ === 'recurring';
      rows.push({ name: p[0], segment: seg2, client_type: typ, frequency: rec ? 'monthly' : 'one_time',
        monthly_value: rec ? amt : null, one_time_value: rec ? null : amt, start_date: today, source: 'import', is_existing: !!existing });
    }
  });
  return { rows: rows, bad: bad };
}
async function insertClientRows(payload) {
  await act(async function () {
    var r = await sb.from('clients').insert(payload);
    if (r.error) throw r.error;
  }, payload.length + ' client' + (payload.length === 1 ? '' : 's') + ' imported.');
}
async function addClients(rows, existing) {
  await act(async function () {
    var payload = rows.map(function (r) {
      var rec = r.type === 'recurring';
      return { name: r.name, segment: r.segment, client_type: r.type, frequency: rec ? 'monthly' : 'one_time',
        monthly_value: rec ? r.amount : null, one_time_value: rec ? null : r.amount, start_date: dayKey(new Date()), source: 'manual', is_existing: !!existing };
    });
    var r = await sb.from('clients').insert(payload);
    if (r.error) throw r.error;
  }, rows.length + ' client' + (rows.length === 1 ? '' : 's') + ' added.');
}
async function editAmount(c) {
  var isRec = c.client_type === 'recurring';
  var v = window.prompt(isRec ? 'New monthly value ($) for ' + c.name + ':' : 'New job amount ($) for ' + c.name + ':', String(isRec ? c.monthly_value : c.one_time_value));
  if (v === null) return;
  var n = num(v.replace(/[$,]/g, ''));
  if (n === null || n < 0) { notice('That was not a valid amount.', true); return; }
  await act(async function () {
    var r = await sb.from('clients').update(isRec ? { monthly_value: n } : { one_time_value: n }).eq('id', c.id);
    if (r.error) throw r.error;
  });
}
async function setClientStatus(c, status) {
  await act(async function () {
    var r = await sb.from('clients').update({ status: status, ended_at: status === 'ended' ? new Date().toISOString() : null }).eq('id', c.id);
    if (r.error) throw r.error;
  });
}
async function deleteClient(c) {
  if (!window.confirm('Delete ' + c.name + ' permanently? If they came from a lead, the lead stays marked as won.')) return;
  await act(async function () { var r = await sb.from('clients').delete().eq('id', c.id); if (r.error) throw r.error; });
}

// ── render all ──────────────────────────────────────────────
function renderAll() {
  renderNow(); renderFilters(); renderLeads(); renderClosing(); renderList(); renderClients();
  $('stamp').textContent = state.loadedAt ? 'Updated ' + state.loadedAt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '';
}

// ── auth + boot ─────────────────────────────────────────────
function show(which) {
  $('setup').hidden = which !== 'setup'; $('login').hidden = which !== 'login'; $('app').hidden = which !== 'app';
}
function route(session) {
  if (session) {
    show('app');
    if (!started) {
      started = true; load();
      timer = setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
      document.addEventListener('visibilitychange', function () { if (!document.hidden && state.loadedAt && Date.now() - state.loadedAt.getTime() > 15000) load(); });
    }
  } else {
    started = false; if (timer) { clearInterval(timer); timer = null; }
    show('login');
  }
}
function boot() {
  if (SUPABASE_URL.indexOf('PASTE_') !== -1 || SUPABASE_PUBLISHABLE_KEY.indexOf('PASTE_') !== -1) { show('setup'); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange(function (evt, session) { route(session); });
  sb.auth.getSession().then(function (r) { route(r.data.session); });
  $('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = $('login-msg'); msg.textContent = 'Sending…';
    var r = await sb.auth.signInWithOtp({ email: $('login-email').value.trim(), options: { emailRedirectTo: window.location.origin + window.location.pathname } });
    msg.textContent = r.error ? 'Could not send the link: ' + r.error.message : 'Check your email for the login link, then open it on this device.';
  });
  $('signout').addEventListener('click', function () { sb.auth.signOut(); });
  $('refresh').addEventListener('click', function () { load(); });
  $('add-lead').addEventListener('click', function () { openLeadForm(null); });
}
window.__mintTest = { state: state, renderAll: renderAll, setClient: function (c) { sb = c; }, groupStats: groupStats, monthlyFrom: monthlyFrom, isFb: isFb, load: load };
boot();
})();
</script>
