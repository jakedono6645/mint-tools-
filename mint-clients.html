<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Database — MINT Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green-dark: #163d25;
  --green-mid: #1e5c38;
  --green-accent: #27ae60;
  --green-light: #eef7f2;
  --green-border: #c8dfd2;
  --text-primary: #0f1f16;
  --text-secondary: #4a6355;
  --text-muted: #8aab96;
  --bg: #f2f7f4;
  --card: #ffffff;
  --shadow: 0 1px 3px rgba(22,61,37,.07), 0 4px 14px rgba(22,61,37,.06);
  --radius: 10px;
  --font: 'Plus Jakarta Sans', sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: var(--text-primary); min-height: 100vh; }

.header {
  background: var(--green-dark);
  color: white;
  padding: 0 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  position: sticky; top: 0; z-index: 100;
}
.header-left .brand { font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
.header-left .title { font-size: 1rem; font-weight: 800; letter-spacing: -.01em; }
.header-back { font-size: .8rem; color: rgba(255,255,255,.6); text-decoration: none; transition: color .15s; }
.header-back:hover { color: white; }

.main { max-width: 1140px; margin: 0 auto; padding: 2rem 1.5rem; }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
  gap: 1rem;
  margin-bottom: 1.75rem;
}
.summary-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 1.2rem 1.4rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--green-border);
}
.summary-card .lbl { font-size: .69rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-muted); margin-bottom: .4rem; }
.summary-card .val { font-size: 1.75rem; font-weight: 800; color: var(--green-dark); letter-spacing: -.03em; line-height: 1; }
.summary-card .sub { font-size: .77rem; color: var(--text-secondary); margin-top: .3rem; }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.filter-row { display: flex; gap: .4rem; flex-wrap: wrap; }
.filter-btn {
  padding: .38rem .85rem; border-radius: 20px;
  border: 1.5px solid var(--green-border); background: white;
  font-family: var(--font); font-size: .79rem; font-weight: 600;
  color: var(--text-secondary); cursor: pointer; transition: all .15s;
}
.filter-btn:hover, .filter-btn.active { background: var(--green-dark); border-color: var(--green-dark); color: white; }

.toolbar-right { display: flex; gap: .6rem; align-items: center; }
.btn-export {
  padding: .45rem 1rem; border-radius: 8px;
  border: 1.5px solid var(--green-border); background: white;
  font-family: var(--font); font-size: .8rem; font-weight: 600;
  color: var(--text-secondary); cursor: pointer; transition: all .15s;
}
.btn-export:hover { border-color: var(--green-mid); color: var(--green-mid); }
.btn-add {
  padding: .48rem 1.1rem; border-radius: 8px; border: none;
  background: var(--green-accent); color: white;
  font-family: var(--font); font-size: .85rem; font-weight: 700;
  cursor: pointer; transition: background .15s; display: flex; align-items: center; gap: .35rem;
}
.btn-add:hover { background: #209c50; }

.table-wrap {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid var(--green-border); overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
thead { background: var(--green-dark); }
th { padding: .7rem 1rem; font-size: .69rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.85); text-align: left; white-space: nowrap; }
td { padding: .82rem 1rem; font-size: .87rem; border-bottom: 1px solid var(--green-border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--green-light); }

.badge { display: inline-flex; align-items: center; padding: .2rem .65rem; border-radius: 20px; font-size: .71rem; font-weight: 700; }
.badge-commercial { background: #dbeafe; color: #1e40af; }
.badge-residential { background: #dcfce7; color: #166534; }
.badge-one-time { background: #fef3c7; color: #92400e; }
.badge-active { background: #dcfce7; color: #166534; }
.badge-inactive { background: #fee2e2; color: #991b1b; }
.badge-pause { background: #fef3c7; color: #92400e; }

.rev-cell { font-weight: 700; color: var(--green-mid); font-variant-numeric: tabular-nums; }
.name-cell { font-weight: 600; }
.notes-cell { font-size: .8rem; color: var(--text-secondary); max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.action-btns { display: flex; gap: .35rem; }
.btn-icon {
  width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--green-border);
  background: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: .78rem; transition: all .15s; color: var(--text-secondary);
}
.btn-icon:hover { background: var(--green-dark); color: white; border-color: var(--green-dark); }
.btn-icon.del:hover { background: #dc2626; border-color: #dc2626; }

.empty { text-align: center; padding: 3.5rem 2rem; color: var(--text-muted); }
.empty .icon { font-size: 2.5rem; margin-bottom: .75rem; }
.empty p { font-size: .9rem; }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .18s; padding: 1rem; }
.overlay.open { opacity: 1; pointer-events: all; }
.modal { background: white; border-radius: 14px; padding: 1.75rem; width: 100%; max-width: 490px; box-shadow: 0 20px 60px rgba(0,0,0,.18); transform: translateY(16px); transition: transform .2s; }
.overlay.open .modal { transform: translateY(0); }
.modal-title { font-size: 1.1rem; font-weight: 800; color: var(--green-dark); margin-bottom: 1.25rem; }
.form-grid { display: grid; gap: .85rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; }
.field label { display: block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-secondary); margin-bottom: .3rem; }
.field input, .field select, .field textarea {
  width: 100%; padding: .58rem .85rem; border: 1.5px solid var(--green-border); border-radius: 8px;
  font-family: var(--font); font-size: .87rem; color: var(--text-primary); transition: border-color .15s; background: white;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--green-accent); }
.field textarea { resize: vertical; min-height: 70px; }
.modal-footer { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.4rem; }
.btn-cancel { padding: .52rem 1.1rem; border-radius: 8px; border: 1.5px solid var(--green-border); background: white; font-family: var(--font); font-size: .84rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
.btn-save { padding: .52rem 1.25rem; border-radius: 8px; border: none; background: var(--green-dark); color: white; font-family: var(--font); font-size: .84rem; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="brand">MINT Cleaning Pros · Internal</div>
    <div class="title">Client Database</div>
  </div>
  <a href="index.html" class="header-back">← Dashboard</a>
</header>

<main class="main">
  <div class="summary-grid" id="summaryGrid"></div>

  <div class="toolbar">
    <div class="filter-row" id="filterRow">
      <button class="filter-btn active" data-filter="all">All Clients</button>
      <button class="filter-btn" data-filter="Active">Active</button>
      <button class="filter-btn" data-filter="Commercial">Commercial</button>
      <button class="filter-btn" data-filter="Residential">Residential</button>
      <button class="filter-btn" data-filter="One-Time">One-Time</button>
    </div>
    <div class="toolbar-right">
      <button class="btn-export" onclick="exportCSV()">Export CSV</button>
      <button class="btn-add" onclick="openModal()">+ Add Client</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Client / Business</th>
          <th>Type</th>
          <th>Frequency</th>
          <th>Monthly Revenue</th>
          <th>Start Date</th>
          <th>Status</th>
          <th>Notes</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="emptyState" class="empty" style="display:none">
      <div class="icon">🧹</div>
      <p>No clients found. Add your first one above.</p>
    </div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Add Client</div>
    <div class="form-grid">
      <div class="field">
        <label>Client / Business Name *</label>
        <input type="text" id="f-name" placeholder="e.g. Battery Source" />
      </div>
      <div class="form-row">
        <div class="field">
          <label>Type</label>
          <select id="f-type">
            <option>Commercial</option>
            <option>Residential</option>
            <option>One-Time</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            <option>Active</option>
            <option>Inactive</option>
            <option>On Pause</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Frequency</label>
          <select id="f-freq">
            <option>Weekly</option>
            <option>Bi-Weekly</option>
            <option>Monthly</option>
            <option>As-Needed</option>
          </select>
        </div>
        <div class="field">
          <label>Monthly Revenue ($)</label>
          <input type="number" id="f-rev" placeholder="0.00" step="0.01" min="0" />
        </div>
      </div>
      <div class="field">
        <label>Start Date</label>
        <input type="date" id="f-start" />
      </div>
      <div class="field">
        <label>Notes (optional)</label>
        <textarea id="f-notes" placeholder="Contact name, location, special instructions..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveClient()">Save Client</button>
    </div>
  </div>
</div>

<script>
const KEY = 'mint_clients_v2';
let clients = [];
let editId = null;
let filter = 'all';

function load() {
  try { clients = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { clients = []; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(clients)); }
function fmt(n) { return '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d) { if (!d) return '—'; const [y,m,day] = d.split('-'); return `${m}/${day}/${y}`; }

function renderSummary() {
  const active = clients.filter(c => c.status === 'Active');
  const mrr = active.reduce((s,c) => s + (parseFloat(c.revenue)||0), 0);
  const comm = active.filter(c => c.type === 'Commercial');
  const res = active.filter(c => c.type === 'Residential');
  const commMRR = comm.reduce((s,c) => s + (parseFloat(c.revenue)||0), 0);
  const resMRR = res.reduce((s,c) => s + (parseFloat(c.revenue)||0), 0);
  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card"><div class="lbl">Total MRR</div><div class="val">${fmt(mrr)}</div><div class="sub">${active.length} active client${active.length!==1?'s':''}</div></div>
    <div class="summary-card"><div class="lbl">Commercial MRR</div><div class="val">${fmt(commMRR)}</div><div class="sub">${comm.length} account${comm.length!==1?'s':''}</div></div>
    <div class="summary-card"><div class="lbl">Residential MRR</div><div class="val">${fmt(resMRR)}</div><div class="sub">${res.length} home${res.length!==1?'s':''}</div></div>
    <div class="summary-card"><div class="lbl">All Clients</div><div class="val">${clients.length}</div><div class="sub">${clients.filter(c=>c.status!=='Active').length} inactive / paused</div></div>
  `;
}

function badgeType(t) {
  const m = {Commercial:'badge-commercial',Residential:'badge-residential','One-Time':'badge-one-time'};
  return `<span class="badge ${m[t]||''}">${t}</span>`;
}
function badgeStatus(s) {
  const m = {Active:'badge-active',Inactive:'badge-inactive','On Pause':'badge-pause'};
  return `<span class="badge ${m[s]||''}">${s}</span>`;
}

function renderTable() {
  const list = clients.filter(c => {
    if (filter === 'all') return true;
    if (filter === 'Active') return c.status === 'Active';
    return c.type === filter;
  });
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  if (!list.length) { tbody.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  tbody.innerHTML = list.map(c => `
    <tr>
      <td class="name-cell">${c.name}</td>
      <td>${badgeType(c.type)}</td>
      <td>${c.frequency}</td>
      <td class="rev-cell">${fmt(c.revenue)}</td>
      <td>${fmtDate(c.startDate)}</td>
      <td>${badgeStatus(c.status)}</td>
      <td class="notes-cell" title="${c.notes||''}">${c.notes||'—'}</td>
      <td><div class="action-btns">
        <button class="btn-icon" onclick="openModal('${c.id}')" title="Edit">✏️</button>
        <button class="btn-icon del" onclick="deleteClient('${c.id}')" title="Delete">🗑</button>
      </div></td>
    </tr>
  `).join('');
}

function render() { renderSummary(); renderTable(); }

function openModal(id) {
  editId = id || null;
  document.getElementById('modalTitle').textContent = id ? 'Edit Client' : 'Add Client';
  if (id) {
    const c = clients.find(x => x.id === id);
    document.getElementById('f-name').value = c.name;
    document.getElementById('f-type').value = c.type;
    document.getElementById('f-status').value = c.status;
    document.getElementById('f-freq').value = c.frequency;
    document.getElementById('f-rev').value = c.revenue||'';
    document.getElementById('f-start').value = c.startDate||'';
    document.getElementById('f-notes').value = c.notes||'';
  } else {
    document.getElementById('f-name').value = '';
    document.getElementById('f-type').value = 'Commercial';
    document.getElementById('f-status').value = 'Active';
    document.getElementById('f-freq').value = 'Bi-Weekly';
    document.getElementById('f-rev').value = '';
    document.getElementById('f-start').value = '';
    document.getElementById('f-notes').value = '';
  }
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 50);
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); editId = null; }

function saveClient() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Client name is required.'); return; }
  const data = {
    name,
    type: document.getElementById('f-type').value,
    status: document.getElementById('f-status').value,
    frequency: document.getElementById('f-freq').value,
    revenue: parseFloat(document.getElementById('f-rev').value) || 0,
    startDate: document.getElementById('f-start').value,
    notes: document.getElementById('f-notes').value.trim(),
  };
  if (editId) {
    const i = clients.findIndex(c => c.id === editId);
    clients[i] = { ...clients[i], ...data };
  } else {
    clients.push({ ...data, id: Date.now().toString() });
  }
  save(); closeModal(); render();
}

function deleteClient(id) {
  if (!confirm('Remove this client from the database?')) return;
  clients = clients.filter(c => c.id !== id);
  save(); render();
}

function exportCSV() {
  const headers = ['Name','Type','Frequency','Monthly Revenue','Start Date','Status','Notes'];
  const rows = clients.map(c => [c.name,c.type,c.frequency,c.revenue,c.startDate,c.status,c.notes||''].map(v=>`"${v}"`).join(','));
  const csv = [headers.join(','),...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = `mint-clients-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

document.getElementById('filterRow').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filter = btn.dataset.filter;
  renderTable();
});

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

load(); render();
</script>
</body>
</html>
